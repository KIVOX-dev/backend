[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
# `pythonpath = ["."]` is required, not cosmetic: the tests import `app.*`, and
# a bare `pytest` (what CI runs) does not put the working directory on
# sys.path — only `python -m pytest` does. Without this the suite collects
# fine locally via `python -m pytest` but fails in CI with
# "ModuleNotFoundError: No module named 'app'".
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
# Matches [tool.ruff] line-length below so the two tools don't disagree about
# where to wrap.
line-length = 100
target-version = ["py312"]
extend-exclude = "/\\.venv/"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
# Defaults (pyflakes + a slice of pycodestyle) only — this project predates
# ruff, so style/modernization rule families (I, UP, B, ...) are left off to
# avoid a repo-wide reformat unrelated to the dependency security audit.
select = ["E4", "E7", "E9", "F"]
# E402: several modules deliberately import after some top-level code runs,
# to break circular-import cycles (see the comments at each site) — a real
# fix means restructuring those modules, which is out of scope here.
ignore = ["E402"]
