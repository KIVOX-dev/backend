[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
# Without this, pytest's import-mode falls back to inserting whichever
# directory it decides is the test package root onto sys.path — here that's
# tests/ itself (there's no tests/__init__.py to make it walk up further),
# not the project root, so `from app...` fails with ModuleNotFoundError in
# CI even though it can appear to work in some local setups.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
# Defaults (pyflakes + a slice of pycodestyle) only — this project predates
# ruff, so style/modernization rule families (I, UP, B, ...) are left off to
# avoid a repo-wide reformat unrelated to the dependency security audit.
select = ["E4", "E7", "E9", "F"]
# E402: several modules deliberately import after some top-level code runs,
# to break circular-import cycles (see the comments at each site) — a real
# fix means restructuring those modules, which is out of scope here.
ignore = ["E402"]
