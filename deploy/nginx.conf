# Single entry point in front of the node-api replicas. Docker's embedded DNS
# resolves `node-api` to every healthy replica's IP and nginx round-robins
# across them, so consecutive requests genuinely land on different instances —
# which is the point: it makes shared-state bugs (rate limits, WebSocket
# broadcast) reproducible locally instead of only under real load.

events {
  worker_connections 1024;
}

http {
  # Re-resolve the service name periodically. Docker hands out new IPs when a
  # replica restarts, and nginx would otherwise cache the dead one until reload.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream node_api {
    server node-api:5000;
    keepalive 32;
  }

  server {
    listen 80;

    # WebSocket chat needs the upgrade handshake forwarded verbatim; without
    # these three headers the connection is silently downgraded to plain HTTP
    # and the client reconnect-loops with no useful error.
    location / {
      proxy_pass http://node_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      # node-api trusts X-Forwarded-For for rate-limit keying, so it must be
      # set here or every request appears to come from nginx's own IP and the
      # whole cluster shares one rate-limit bucket.
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 300s;
      proxy_connect_timeout 5s;
    }
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
}
