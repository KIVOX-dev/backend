# Cloud Build config for this monorepo. There is intentionally NO Dockerfile
# at the repo root — node-api/ and ai-service/ each have their own, built
# with their own directory as build context. Every step below is explicit
# about which Dockerfile + context it uses so Cloud Build never falls back
# to guessing /workspace/Dockerfile.
#
# Trigger setup (GCP Console → Cloud Build → Triggers):
#   Configuration: "Cloud Build configuration file (yaml or json)"
#   Location:      cloudbuild.yaml  (repo root)
# Do NOT use the "Dockerfile" build-type option for this repo — that option
# has no field for per-service subdirectories on some trigger UIs and is what
# produces the `lstat /workspace/Dockerfile: no such file or directory` error.
#
# Required substitution variables (set in the trigger, Console → Edit trigger
# → Substitution variables):
#   _REGION   e.g. asia-south1
#   _AR_REPO  Artifact Registry repo name, e.g. upscaler-images
#
# Required IAM roles for the Cloud Build service account
# (<project-number>@cloudbuild.gserviceaccount.com):
#   roles/artifactregistry.writer   - push images
#   roles/run.admin                 - deploy to Cloud Run
#   roles/iam.serviceAccountUser    - act as the Cloud Run runtime service account
#   roles/logging.logWriter         - already granted by default
#   roles/secretmanager.secretAccessor - read the secrets below when wiring --set-secrets
#
# node-api/src/config/env.js throws (crashing the container before it ever
# binds a port) if JWT_SECRET, JWT_REFRESH_SECRET, or MONGODB_URI are unset.
# Create secret values via the Secret Manager Console UI (New Secret / New
# Version) rather than piping literal values through a shell here — keeps
# them out of shell history and this file. Required secrets:
#   node-api-jwt-secret         random string (e.g. openssl rand -base64 48)
#   node-api-jwt-refresh-secret random string, different from the above
#   node-api-mongodb-uri        MongoDB Atlas connection string
#   node-api-brevo-api-key      Brevo transactional-email API key
#   ai-service-shared-secret    random string — used by BOTH services below;
#                                must be byte-identical on both sides, since
#                                it's how node-api and ai-service authenticate
#                                to each other (see aiServiceClient.js /
#                                ai-service/app/config.py)
#   ai-service-groq-api-key     Groq API key
#
# Then grant the Cloud Run runtime service account
# (<project-number>-compute@developer.gserviceaccount.com, unless you deploy
# with a dedicated one) roles/secretmanager.secretAccessor on each of the
# five secrets above (Secret Manager → secret → Permissions → Grant Access).

substitutions:
  _REGION: europe-west1
  _AR_REPO: cloud-run-source-deploy

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s

steps:
  # ---- node-api ----
  - id: build-node-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - node-api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/node-api:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/node-api:latest
      - node-api

  - id: push-node-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/node-api
    waitFor: [build-node-api]

  # ---- ai-service ----
  - id: build-ai-service
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - ai-service/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ai-service:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ai-service:latest
      - ai-service

  - id: push-ai-service
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ai-service
    waitFor: [build-ai-service]

  # ---- deploy: ai-service first (node-api calls it; it holds no state) ----
  - id: deploy-ai-service
    name: gcr.io/cloud-builders/gcloud
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ai-service
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ai-service:${SHORT_SHA}
      - --region=${_REGION}
      - --port=8001
      - --no-allow-unauthenticated
      - --set-env-vars=AI_SERVICE_ENV=production
      - --set-secrets=AI_SERVICE_SHARED_SECRET=ai-service-shared-secret:latest,GROQ_API_KEY=ai-service-groq-api-key:latest
      - --quiet
    waitFor: [push-ai-service]

  - id: deploy-node-api
    name: gcr.io/cloud-builders/gcloud
    entrypoint: gcloud
    args:
      - run
      - deploy
      - node-api
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/node-api:${SHORT_SHA}
      - --region=${_REGION}
      - --allow-unauthenticated
      - --set-env-vars=NODE_ENV=production,AI_SERVICE_URL=https://ai-service-177421000110.europe-west1.run.app
      - --set-secrets=JWT_SECRET=node-api-jwt-secret:latest,JWT_REFRESH_SECRET=node-api-jwt-refresh-secret:latest,MONGODB_URI=node-api-mongodb-uri:latest,AI_SERVICE_SHARED_SECRET=ai-service-shared-secret:latest,BREVO_API_KEY=node-api-brevo-api-key:latest
      - --quiet
    waitFor: [push-node-api, deploy-ai-service]
