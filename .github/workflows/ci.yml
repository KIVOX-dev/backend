name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-api:
    name: node-api / lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: node-api/package-lock.json

      - run: npm ci

      # TODO: no .eslintrc exists yet for node-api — add one, then drop the
      # `continue-on-error` below so lint failures actually fail the build.
      - name: Lint
        continue-on-error: true
        run: npx eslint . || echo "::warning::no ESLint config in node-api yet"

      # TODO: package.json has no "test" script and no test files exist yet.
      # Add Jest/Vitest + real tests, then change this to a hard `npm test`.
      - name: Test
        run: npm test --if-present

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  python-service:
    name: python-service / lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python-service/requirements.txt

      - run: pip install -r requirements.txt

      # TODO: no lint tool is declared in requirements.txt yet. Add `ruff` as a
      # dev dependency, then drop `continue-on-error`.
      - name: Lint (ruff)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check .

      # TODO: no test files exist yet (only vendored dependency tests under
      # .venv, which are irrelevant). Add `pytest` + real tests under `tests/`,
      # then remove `--co` (collect-only) so this actually executes assertions.
      - name: Test (pytest)
        run: |
          pip install pytest
          pytest --collect-only || echo "::warning::no test suite in python-service yet"

      - name: pip-audit (dependency vulnerability scan)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker-build:
    name: Docker build (both services)
    needs: [node-api, python-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: node-api/Dockerfile currently fails — it COPYs a `sql/` folder
      # that no longer exists (DB moved from Postgres to Mongo). Fix that
      # before this job will pass.
      - name: Build node-api image
        uses: docker/build-push-action@v5
        with:
          context: node-api
          push: false
          tags: node-api:ci

      - name: Build python-service image
        uses: docker/build-push-action@v5
        with:
          context: python-service
          push: false
          tags: python-service:ci

      # Scan built images for known CVEs before they ever reach a registry.
      - name: Trivy scan — node-api
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: node-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Trivy scan — python-service
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: python-service:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  # Deploy is intentionally separate from the CI job above and gated on `main`
  # only, so a red build can never reach Cloud Run. It's commented out end-to-end
  # because no GCP project/Workload Identity Federation is wired up yet — see the
  # GCP section of the audit for what needs to exist before this can be enabled.
