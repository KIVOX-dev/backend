name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  # ── Node.js API ─────────────────────────────────────────────────────────
  # Lint, test, and dependency-audit run as independent jobs so a failure in
  # one is reported on its own (one failing check per concern, clear logs)
  # and the three run in parallel instead of stacking wall-clock time in a
  # single job.
  node-lint:
    name: node-api / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: node-api/package-lock.json
      - run: npm ci
      - run: npm run lint

  node-test:
    name: node-api / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: node-api/package-lock.json
      - run: npm ci
      - run: npm test

  node-audit:
    name: node-api / dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: node-api/package-lock.json
      - run: npm ci
      # Fails only on Critical/High advisories — Moderate/Low still show up in
      # the log but don't block the build, so this gates on genuine risk
      # rather than every transitive advisory that shows up upstream.
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  # ── Python service ──────────────────────────────────────────────────────
  python-lint:
    name: python-service / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: python-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      # Formatting is checked separately from ruff so a failure says clearly
      # which of the two is unhappy. Both are pinned to line-length 100 in
      # pyproject.toml, so they cannot disagree about wrapping.
      - name: Format check (black)
        run: black --check .

  python-test:
    name: python-service / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: python-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Test (pytest)
        run: pytest -v

  python-audit:
    name: python-service / dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: python-service/requirements.txt
      - run: pip install -r requirements.txt
      - name: pip-audit (dependency vulnerability scan)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker-build:
    name: Docker build (both services)
    needs: [node-lint, node-test, node-audit, python-lint, python-test, python-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build node-api image
        uses: docker/build-push-action@v5
        with:
          context: node-api
          push: false
          tags: node-api:ci

      - name: Build python-service image
        uses: docker/build-push-action@v5
        with:
          context: python-service
          push: false
          tags: python-service:ci

      # Scan built images for known CVEs before they ever reach a registry.
      # Pinned to a commit SHA (not a mutable tag/branch like `@master`) —
      # third-party actions should be pinned the same way a dependency would
      # be, since an unpinned ref can start running different code with no
      # change on our side.
      - name: Trivy scan — node-api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: node-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Trivy scan — python-service
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: python-service:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  # Deploy is intentionally separate from the CI jobs above and gated on `main`
  # only, so a red build can never reach Cloud Run. It's commented out end-to-end
  # because no GCP project/Workload Identity Federation is wired up yet — see the
  # GCP section of the audit for what needs to exist before this can be enabled.
  #
  # deploy:
  #   name: Deploy to Cloud Run
  #   needs: [docker-build]
  #   if: github.ref == 'refs/heads/main'
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     id-token: write   # for Workload Identity Federation — no long-lived JSON keys
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: google-github-actions/auth@v2
  #       with:
  #         workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
  #         service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
  #     - uses: google-github-actions/setup-gcloud@v2
  #     - run: |
  #         gcloud builds submit node-api --tag ${{ secrets.AR_REPO }}/node-api:${{ github.sha }}
  #         gcloud run deploy node-api-prod \
  #           --image ${{ secrets.AR_REPO }}/node-api:${{ github.sha }} \
  #           --region ${{ secrets.GCP_REGION }} \
  #           --no-traffic --tag pr-${{ github.sha }}
  #         # promote traffic only after health check + smoke test pass, e.g.:
  #         # gcloud run services update-traffic node-api-prod --to-latest
