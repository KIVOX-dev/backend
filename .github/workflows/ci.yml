name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  # ── Node.js API ─────────────────────────────────────────────────────────
  # Lint, test, and dependency-audit run as independent jobs so a failure in
  # one is reported on its own (one failing check per concern, clear logs)
  # and the three run in parallel instead of stacking wall-clock time in a
  # single job.
  node-lint:
    name: node-api / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: node-api/package-lock.json
      - run: npm ci
      - run: npm run lint

  node-test:
    name: node-api / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: node-api/package-lock.json
      - run: npm ci
      - run: npm test

  node-audit:
    name: node-api / dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: node-api/package-lock.json
      - run: npm ci
      # Fails only on Critical/High advisories — Moderate/Low still show up in
      # the log but don't block the build, so this gates on genuine risk
      # rather than every transitive advisory that shows up upstream.
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  # ── AI Service (FastAPI) ────────────────────────────────────────────────
  # Same three-job split as node-api above, same reasoning.
  ai-lint:
    name: ai-service / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ai-service/requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: ruff check .

  ai-test:
    name: ai-service / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ai-service/requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: pytest -v

  ai-audit:
    name: ai-service / dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      # PYSEC-2026-1325 (python-ecdsa, pulled in transitively by python-jose):
      # a Minerva timing side-channel against ECDSA private-key signing
      # operations. This service only ever signs/verifies HS256 (HMAC)
      # tokens — see app/security.py — never ECDSA, and upstream has stated
      # side-channel attacks are out of scope with no planned fix. Ignored
      # here rather than left to silently fail the build on every run.
      - name: pip-audit (fail on anything else)
        run: pip-audit -r requirements-lock.txt --ignore-vuln PYSEC-2026-1325

  docker-build:
    name: Docker build (node-api)
    needs: [node-lint, node-test, node-audit]
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Build node-api image
        uses: docker/build-push-action@v5
        with:
          context: node-api
          push: false
          load: true # image must land in the local Docker daemon — the smoke-test step below runs it
          tags: node-api:ci

      # Scan the built image for known CVEs before it ever reaches a registry.
      # Pinned to a commit SHA (not a mutable tag/branch like `@master`) —
      # third-party actions should be pinned the same way a dependency would
      # be, since an unpinned ref can start running different code with no
      # change on our side.
      - name: Trivy scan — node-api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: node-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

      # A clean scan and a successful build both say nothing about whether
      # the image actually *starts* — this is what would have caught the
      # uploads/ directory permission bug (see Dockerfile's chown step):
      # the build succeeded and Trivy was happy, but `docker run` crashed
      # immediately on every attempt. Boots the real image against a real
      # (ephemeral, in-CI) MongoDB and hits /health for real.
      - name: Smoke test — container actually starts
        run: |
          docker run -d --rm --name node-api-smoke -p 5000:5000 \
            --network host \
            -e MONGODB_URI="mongodb://127.0.0.1:27017" \
            -e MONGODB_DB_NAME="ci_smoke" \
            -e JWT_SECRET="ci-smoke-secret" \
            -e JWT_REFRESH_SECRET="ci-smoke-refresh-secret" \
            -e CORS_ORIGINS="http://localhost:3000" \
            node-api:ci
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:5000/health; then echo "container is healthy"; exit 0; fi
            sleep 1
          done
          echo "Container never became healthy:"
          docker logs node-api-smoke
          exit 1

  docker-build-ai:
    name: Docker build (ai-service)
    needs: [ai-lint, ai-test, ai-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ai-service image
        uses: docker/build-push-action@v5
        with:
          context: ai-service
          push: false
          load: true
          tags: ai-service:ci

      - name: Trivy scan — ai-service
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai-service:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

      # Same reasoning as node-api's smoke test above — a clean build and
      # scan say nothing about whether the process actually starts under its
      # non-root user with no config beyond the image's own defaults.
      - name: Smoke test — container actually starts
        run: |
          docker run -d --rm --name ai-service-smoke -p 8001:8001 ai-service:ci
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8001/health; then echo "container is healthy"; exit 0; fi
            sleep 1
          done
          echo "Container never became healthy:"
          docker logs ai-service-smoke
          exit 1

  # Deploy is intentionally separate from the CI jobs above and gated on `main`
  # only, so a red build can never reach Cloud Run. It's commented out end-to-end
  # because no GCP project/Workload Identity Federation is wired up yet — see the
  # GCP section of the audit for what needs to exist before this can be enabled.
  #
  # deploy:
  #   name: Deploy to Cloud Run
  #   needs: [docker-build]
  #   if: github.ref == 'refs/heads/main'
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     id-token: write   # for Workload Identity Federation — no long-lived JSON keys
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: google-github-actions/auth@v2
  #       with:
  #         workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
  #         service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
  #     - uses: google-github-actions/setup-gcloud@v2
  #     - run: |
  #         gcloud builds submit node-api --tag ${{ secrets.AR_REPO }}/node-api:${{ github.sha }}
  #         gcloud run deploy node-api-prod \
  #           --image ${{ secrets.AR_REPO }}/node-api:${{ github.sha }} \
  #           --region ${{ secrets.GCP_REGION }} \
  #           --no-traffic --tag pr-${{ github.sha }}
  #         # promote traffic only after health check + smoke test pass, e.g.:
  #         # gcloud run services update-traffic node-api-prod --to-latest
